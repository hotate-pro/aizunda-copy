name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m py_compile llm_adapter.py voicevox_adapter.py performance.py server.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/avatar.js
